<style>
/* ===================================================================
   vibe70 공통 테마 — ubuntu2404 강좌와 같은 분위기 (라이트 / 다크)
   색을 바꾸려면 --accent / --accent2 와 .hero 그라데이션만 고치면 됩니다.
   =================================================================== */
:root {
  --bg: #f4f6f9;
  --pane: #ffffff;
  --card: #ffffff;
  --card2: #f7f9fc;
  --line: #e1e6ee;
  --fg: #1d2433;
  --muted: #6b7587;
  --accent: #7c3aed;        /* 바이올렛 */
  --accent-soft: #f1ebfd;
  --accent2: #c2185b;       /* 라즈베리 */
  --accent2-soft: #fce8f0;
  --ok: #1f9d55;
  --ok-soft: #e3f6ec;
  --warn: #c98a00;
  --warn-soft: #fff6d9;
  --danger: #d64541;
  --danger-soft: #fdeaea;
  --info: #2563eb;
  --info-soft: #e8f0fe;
  --code-bg: #f6f8fb;
  --code-fg: #24292f;
  --term-bg: #0f1419;
  --term-fg: #d7dde8;
  --term-muted: #7d8799;
  --term-in: #7ee787;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 4px 16px rgba(20, 30, 50, .06);
  --radius: 10px;
  --nav-w: 290px;
  --grad: linear-gradient(135deg, #7c3aed 0%, #b4248f 48%, #2a0f45 100%);
  --grad-bar: linear-gradient(90deg, #7c3aed, #f472b6);
  --mono: 'JetBrains Mono', 'D2Coding', Consolas, 'Courier New', monospace;
  --sans: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --pane: #151a21; --card: #1a2029; --card2: #1f2631; --line: #2a323e;
    --fg: #e3e8f0; --muted: #8d97a8;
    --accent: #a78bfa; --accent-soft: #241b3d; --accent2: #f472b6; --accent2-soft: #3a1a2d;
    --ok: #4cc983; --ok-soft: #132e20; --warn: #f2c14e; --warn-soft: #33290f;
    --danger: #ff6b61; --danger-soft: #3a1a18; --info: #79a7ff; --info-soft: #16233b;
    --code-bg: #11161d; --code-fg: #d6deeb;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --pane: #151a21; --card: #1a2029; --card2: #1f2631; --line: #2a323e;
  --fg: #e3e8f0; --muted: #8d97a8;
  --accent: #a78bfa; --accent-soft: #241b3d; --accent2: #f472b6; --accent2-soft: #3a1a2d;
  --ok: #4cc983; --ok-soft: #132e20; --warn: #f2c14e; --warn-soft: #33290f;
  --danger: #ff6b61; --danger-soft: #3a1a18; --info: #79a7ff; --info-soft: #16233b;
  --code-bg: #11161d; --code-fg: #d6deeb;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, code, kbd, pre, input { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
  font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
code, kbd, pre { font-family: var(--mono); }
kbd { font-size: .82em; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--card2); }

/* ---------------------------------------------------------------- 버튼 */
.btn {
  display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
  border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px;
  white-space: nowrap; transition: background .12s, border-color .12s, color .12s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.icon-btn {
  border: none; background: transparent; cursor: pointer; font-size: 17px; line-height: 1; text-decoration: none;
  width: 32px; height: 32px; border-radius: 8px; color: var(--muted); display: inline-grid; place-items: center; flex: none;
}
.icon-btn:hover { background: var(--card2); color: var(--fg); }

/* ---------------------------------------------------------------- 왼쪽 사이드바 (nav.js 가 만듭니다) */
.vnav {
  position: fixed; inset: 0 auto 0 0; width: var(--nav-w); z-index: 60;
  display: flex; flex-direction: column; background: var(--pane); border-right: 1px solid var(--line);
  transition: transform .2s ease;
}
.vnav .brand { display: flex; align-items: center; gap: 10px; padding: 14px 10px 10px 14px; }
.vnav .brand-logo {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 21px; flex: none;
  background: linear-gradient(135deg, #7c3aed, #f472b6); text-decoration: none; box-shadow: 0 2px 8px rgba(124, 58, 237, .35);
}
.vnav .brand-text { flex: 1; min-width: 0; }
.vnav .brand-title { font-weight: 800; font-size: 16px; letter-spacing: -.01em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vnav .brand-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vnav .progress-wrap { padding: 2px 14px 8px; }
.vnav .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 600; }
.vnav .progress { height: 6px; background: var(--card2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.vnav .progress i { display: block; height: 100%; width: 0; background: var(--grad-bar); transition: width .3s; }
.vnav .nav-search {
  margin: 4px 12px 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card2); outline: none;
}
.vnav .nav-search:focus { border-color: var(--accent); }
.vnav .nav-tree { flex: 1; overflow-y: auto; padding: 2px 8px 16px; }
.vnav .nav-home {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; font-weight: 700;
  color: var(--fg); text-decoration: none; font-size: 14px;
}
.vnav .nav-home:hover { background: var(--card2); }
.vnav .nav-home.active { background: var(--accent-soft); color: var(--accent); }
.vnav .nav-group { font-size: 12px; font-weight: 700; color: var(--muted); padding: 14px 10px 4px; }
.vnav .nav-ch { margin-top: 2px; }
.vnav .nav-ch-head {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; user-select: none;
  font-weight: 700; font-size: 14px;
}
.vnav .nav-ch-head:hover { background: var(--card2); }
.vnav .nav-ch-head .no {
  font: 700 11.5px var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; min-width: 38px; text-align: center;
}
.vnav .nav-ch-head .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vnav .nav-ch-head .cnt { font-size: 11px; color: var(--muted); font-weight: 500; }
.vnav .nav-ch-head .caret { color: var(--muted); font-size: 10px; transition: transform .15s; }
.vnav .nav-ch.open .caret { transform: rotate(90deg); }
.vnav .nav-ch.active > .nav-ch-head { color: var(--accent); }
.vnav .nav-secs { display: none; padding: 2px 0 6px 14px; margin-left: 20px; border-left: 1px dashed var(--line); }
.vnav .nav-ch.open .nav-secs { display: block; }
.vnav .nav-sec {
  display: flex; gap: 6px; align-items: flex-start; padding: 5px 8px; border-radius: 7px; font-size: 13.5px;
  color: var(--fg); text-decoration: none; line-height: 1.45;
}
.vnav .nav-sec:hover { background: var(--card2); }
.vnav .nav-sec.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.vnav .nav-sec .chk { flex: none; width: 16px; color: var(--muted); font-size: 12px; margin-top: 1px; }
.vnav .nav-sec.done .chk { color: var(--ok); }
.vnav .nav-sec.period { font-size: 13px; color: var(--muted); }
.vnav .nav-sec.period b { font: 600 11px var(--mono); color: var(--accent2); margin-right: 2px; }
.vnav .nav-sec .hit { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.vnav .nav-sep { height: 1px; background: var(--line); margin: 5px 8px; opacity: .7; }
.vnav .nav-foot { border-top: 1px solid var(--line); padding: 8px 10px; }
.vnav .tool-badge {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card2);
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
}
.vnav .tool-badge .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); flex: none; }
.vnav-open {
  position: fixed; left: 14px; bottom: 16px; z-index: 61; width: 46px; height: 46px; border-radius: 50%;
  border: none; background: linear-gradient(135deg, #7c3aed, #f472b6); color: #fff; font-size: 19px; cursor: pointer;
  box-shadow: 0 4px 16px rgba(124, 58, 237, .4); display: none;
}
.vnav-bd { position: fixed; inset: 0; background: rgba(8, 12, 18, .5); z-index: 59; display: none; }
body.has-nav { padding-left: var(--nav-w); }
body.nav-collapsed { padding-left: 0; }
body.nav-collapsed .vnav { transform: translateX(-100%); }
body.nav-collapsed .vnav-open { display: block; }
@media (max-width: 1000px) {
  body.has-nav { padding-left: 0; }
  .vnav { transform: translateX(-100%); box-shadow: 0 0 30px rgba(0, 0, 0, .25); }
  body.nav-open .vnav { transform: none; }
  body.nav-open .vnav-bd { display: block; }
  .vnav-open { display: block; }
  body.nav-open .vnav-open { display: none; }
}
@media print { .vnav, .vnav-open, .vnav-bd { display: none !important; } body.has-nav { padding-left: 0; } }

/* ---------------------------------------------------------------- 위쪽 줄 (일차 페이지 공통) */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 7px 14px; min-height: 46px; background: var(--pane); border-bottom: 1px solid var(--line);
}
.crumb { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.crumb b { color: var(--fg); }
.view-switch { display: flex; background: var(--card2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; flex: none; }
.view-switch a {
  border-radius: 7px; padding: 3px 10px; font-weight: 700; font-size: 12.5px; color: var(--muted); text-decoration: none; white-space: nowrap;
}
.view-switch a:hover { color: var(--fg); }
.view-switch a.active { background: var(--pane); color: var(--accent); box-shadow: var(--shadow); }

/* ---------------------------------------------------------------- 문서 공통 */
.doc { max-width: 920px; margin: 0 auto; padding: 28px 34px 80px; }
.hero {
  border-radius: 16px; padding: 30px 32px; margin-bottom: 20px; color: #fff; position: relative; overflow: hidden;
  background: radial-gradient(circle at 85% 20%, rgba(255, 255, 255, .18), transparent 40%), var(--grad);
}
.hero .badge { display: inline-flex; font-weight: 700; font-size: 12.5px; background: rgba(255, 255, 255, .18); border-radius: 20px; padding: 3px 12px; }
.hero h1 { margin: 10px 0 6px; font-size: 32px; line-height: 1.25; letter-spacing: -.02em; }
.hero p { margin: 4px 0; opacity: .95; max-width: 62ch; }
.hero .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.hero .btn { background: rgba(255, 255, 255, .95); color: #1d2433; border-color: transparent; }
.hero .btn.outline { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .7); }
.hero .emo { position: absolute; right: 26px; bottom: -18px; font-size: 120px; opacity: .22; pointer-events: none; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: var(--card); border-radius: 20px; padding: 2px 10px; color: var(--muted); }
.hero .chip { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .35); color: #fff; }
.callout { border-radius: var(--radius); padding: 12px 16px; margin: 14px 0; border: 1px solid var(--line); border-left-width: 5px; background: var(--card); }
.callout .ct { font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.callout p { margin: 4px 0; }
.callout.tip { border-left-color: var(--ok); background: var(--ok-soft); }
.callout.tip .ct { color: var(--ok); }
.callout.warn { border-left-color: var(--danger); background: var(--danger-soft); }
.callout.warn .ct { color: var(--danger); }
.callout.info { border-left-color: var(--accent); background: var(--accent-soft); }
.callout.info .ct { color: var(--accent); }

@media (max-width: 860px) {
  .doc { padding: 20px 16px 60px; }
  .hero { padding: 24px 20px; }
  .hero h1 { font-size: 26px; }
  .view-switch a { padding: 3px 8px; }
}

/* 퀴즈 — theme.css 위에 얹는 스타일 */
.doc.narrow { max-width: 780px; }
.qprog { height: 6px; background: var(--card2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 4px 0 14px; }
.qprog i { display: block; height: 100%; width: 0; background: var(--grad-bar); transition: width .35s; }
.meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.meta .qn { font: 700 13px var(--mono); color: var(--accent2); }
.meta .sc { font-size: 13px; font-weight: 700; color: var(--muted); }

.qcard { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
.qtext { font-size: 17.5px; font-weight: 700; line-height: 1.55; }
.qcard pre { background: var(--code-bg); border: 1px solid var(--line); padding: 10px 14px; border-radius: 8px; font-size: 13px; overflow-x: auto; margin: 12px 0 0; }
code { font-size: .9em; background: var(--card2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; color: var(--accent2); }

.opts { display: grid; gap: 8px; margin-top: 16px; }
.opt {
  text-align: left; border: 1px solid var(--line); background: var(--card2); border-radius: 8px; padding: 10px 14px;
  cursor: pointer; display: flex; gap: 10px; align-items: flex-start; width: 100%; font-size: 15px; line-height: 1.5;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .mk { font-weight: 800; color: var(--muted); flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .mk { color: var(--ok); }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt.wrong .mk { color: var(--danger); }

.typed { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
input[type=text] {
  flex: 1 1 240px; font-family: var(--mono); font-size: 15px; background: var(--card2);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; outline: none;
}
input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

button.go, a.go { font-weight: 700; font-size: 14.5px; color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 20px; cursor: pointer; text-decoration: none; }
button.go:hover { filter: brightness(1.07); }
button.ghost, a.ghost { font-weight: 600; font-size: 14px; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 16px; cursor: pointer; text-decoration: none; }
button.ghost:hover, a.ghost:hover { border-color: var(--accent); }
.actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

.fb { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: var(--ok-soft); border-left: 5px solid var(--ok); }
.fb.no { background: var(--danger-soft); border-left-color: var(--danger); }
.fb .v { display: block; font-weight: 800; color: var(--ok); }
.fb.no .v { color: var(--danger); }
.fb p { margin: 2px 0 0; font-size: 14.5px; }

.res { padding: 28px 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); text-align: center; }
.res .big { font: 800 52px var(--mono); line-height: 1; background: var(--grad-bar); -webkit-background-clip: text; background-clip: text; color: transparent; }
.res .big.mid { background: none; color: var(--warn); }
.res .big.low { background: none; color: var(--danger); }
.res h2 { font-size: 20px; margin: 14px 0 0; }
.res p { color: var(--muted); max-width: 48ch; margin: 8px auto 0; }
.res .actions { justify-content: center; }
.missed { margin-top: 22px; text-align: left; border-top: 1px solid var(--line); padding-top: 16px; }
.missed h3 { font-size: 14px; color: var(--accent2); margin: 0 0 8px; }
.missed li { font-size: 14px; margin-top: 7px; }
footer.docfoot { max-width: 780px; margin: 0 auto; padding: 0 34px 40px; font-size: 12.5px; color: var(--muted); }
@media (max-width: 860px) { footer.docfoot { padding: 0 16px 40px; } }

</style>
</head>

    ],
    "ans": "플랜 모드",
    "e": "플랜 모드에서는 파일을 바꾸지 않고 계획만 보여 줍니다. 다른 도구에서는 \"계획만 먼저 보여줘\"로 요청합니다."
  },
  {
    "q": "\"작게 쪼개기\" 리듬으로 알맞은 것은?",
    "o": [
      "기능 하나 만들고 확인하고 커밋",
      "모든 기능을 한 번에 요청하고 마지막에 커밋",
      "커밋 없이 계속 진행",
      "확인 없이 바로 배포"
    ],
    "a": 0,
    "e": "작게 나눠야 문제가 생겼을 때 어디서 생겼는지 알고 되돌릴 수 있습니다."
  }
];
window.PASS = 4;
</script>
<script>
(function(){
  const Q = window.QUIZ || [];

  const $ = id => document.getElementById(id);
  let i = 0, score = 0, missed = [], answered = false;

  const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ');

  function render(){
    answered = false;
    const q = Q[i];
    $('qn').textContent = 'Q ' + String(i+1).padStart(2,'0') + ' / ' + Q.length;
    $('sc').textContent = '정답 ' + score;
    $('prog').style.width = (i / Q.length * 100) + '%';

    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = '<div class="qtext">' + q.q + '</div>' + (q.pre ? '<pre>' + q.pre + '</pre>' : '');

    if (q.t){
      const wrap = document.createElement('div');
      wrap.className = 'typed';
      wrap.innerHTML = '<input type="text" id="inp" autocomplete="off" autocapitalize="off" ' +
                       'spellcheck="false" placeholder="명령을 그대로 입력하세요">' +
                       '<button class="go" id="chk">확인</button>';
      card.appendChild(wrap);
      card.appendChild(mkFoot());
      $('area').replaceChildren(card);
      $('inp').focus();
      $('chk').onclick = () => judgeTyped(q);
      $('inp').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); answered ? nextQ() : judgeTyped(q); } });
    } else {
      const order = q.o.map((t,n) => n);
      for (let k = order.length - 1; k > 0; k--){ const j = Math.floor(Math.random()*(k+1)); [order[k],order[j]] = [order[j],order[k]]; }
      const box = document.createElement('div');
      box.className = 'opts';
      order.forEach((oi, pos) => {
        const b = document.createElement('button');
        b.className = 'opt'; b.type = 'button'; b.dataset.i = oi;
        b.innerHTML = '<span class="mk">' + 'ABCD'[pos] + '</span><span>' + q.o[oi] + '</span>';
        b.onclick = () => judgeChoice(q, b, box);
        box.appendChild(b);
      });
      card.appendChild(box);
      card.appendChild(mkFoot());
      $('area').replaceChildren(card);
    }
  }

  function mkFoot(){
    const d = document.createElement('div');
    d.id = 'foot';
    return d;
  }

  function feedback(ok, q, extra){
    answered = true;
    score += ok ? 1 : 0;
    if (!ok) missed.push(i);
    $('sc').textContent = '정답 ' + score;
    const f = document.createElement('div');
    f.className = 'fb' + (ok ? '' : ' no');
    f.innerHTML = '<span class="v">' + (ok ? '정답' : '오답') + '</span><p>' + (extra || '') + q.e + '</p>';
    const act = document.createElement('div');
    act.className = 'actions';
    const b = document.createElement('button');
    b.className = 'go';
    b.textContent = (i === Q.length - 1) ? '결과 보기' : '다음 문제';
    b.onclick = nextQ;
    act.appendChild(b);
    const foot = $('foot');
    foot.replaceChildren(f, act);
    b.focus();
  }

  function judgeChoice(q, btn, box){
    if (answered) return;
    const pick = +btn.dataset.i, ok = pick === q.a;
    Array.from(box.children).forEach(el => {
      el.disabled = true;
      const n = +el.dataset.i;
      if (n === q.a) el.classList.add('right');
      else if (n === pick) el.classList.add('wrong');
    });
    feedback(ok, q, ok ? '' : '정답은 <code>' + q.o[q.a] + '</code> 입니다. ');
  }

  function judgeTyped(q){
    if (answered) return;
    const inp = $('inp');
    const v = norm(inp.value);
    if (!v){ inp.focus(); return; }
    const ok = q.acc.some(a => norm(a) === v);
    inp.disabled = true;
    $('chk').disabled = true;
    feedback(ok, q, ok ? '' : '정답은 <code>' + q.ans + '</code> 입니다. ');
  }

  function nextQ(){
    i++;
    if (i >= Q.length) result(); else render();
  }

  function result(){
    $('prog').style.width = '100%';
    $('qn').textContent = '완료';
    $('sc').textContent = '정답 ' + score;
    const pass = window.PASS || Math.ceil(Q.length*0.8);
    const cls = score >= pass ? "" : (score >= pass - 3 ? " mid" : " low");
    const msg = score >= pass
      ? '통과입니다. 오늘 분량을 충분히 소화했습니다.'
      : (score >= pass - 3
        ? '조금 아쉽습니다. 틀린 항목의 미션으로 돌아가 한 번만 더 확인하고 다시 풀어 보세요.'
        : '아직 손에 붙지 않았습니다. 실습 가이드의 미션 1번부터 다시 따라 해 보는 편이 빠릅니다.');

    const d = document.createElement('div');
    d.className = 'res';
    d.innerHTML =
      '<div class="big' + cls + '">' + score + ' / ' + Q.length + '</div>' +
      '<h2>' + (score >= pass ? "통과" : "한 번 더") + '</h2>' +
      '<p>' + msg + '</p>';

    if (missed.length){
      const m = document.createElement('div');
      m.className = 'missed';
      m.innerHTML = '<h3>다시 볼 문항</h3><ul>' +
        missed.map(n => '<li><b>Q' + String(n+1).padStart(2,'0') + '</b> — ' +
          Q[n].q.replace(/<[^>]+>/g,'') + '</li>').join('') + '</ul>';
      d.appendChild(m);
    }

    const act = document.createElement('div');
    act.className = 'actions';
    const again = document.createElement('button');
    again.className = 'go'; again.textContent = '처음부터 다시 풀기';
    again.onclick = () => { i = 0; score = 0; missed = []; render(); window.scrollTo(0,0); };
    act.appendChild(again);
    const back = document.createElement('a');
    back.href = 'lab.html'; back.className = 'ghost';
    back.style.cssText = 'text-decoration:none;display:inline-flex;align-items:center;padding:12px 20px;border:1px solid var(--line-strong);border-radius:5px;color:var(--ink-2);font-weight:600;font-size:15px';
    back.textContent = '실습 가이드로';
    act.appendChild(back);
    d.appendChild(act);

    $('area').replaceChildren(d);
  }

  render();
})();

</script>
<script src="../nav.js"></script>
</body>
</html>
