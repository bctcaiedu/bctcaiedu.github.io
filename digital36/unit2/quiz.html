<style>
:root{

    --line:#DBE2DC;--line-strong:#C3CFC6;--accent:#10684A;--accent-soft:#E2EFE8;

    :root:not([data-theme="light"]){
      --bg:#0F1311;--surface:#161C19;--surface-2:#1C2320;--ink:#E7ECE8;--ink-2:#C2CCC6;--muted:#94A29A;
      --line:#27302B;--line-strong:#36423B;--accent:#57C294;--accent-soft:#14261E;
      --clay:#E08F6E;--clay-soft:#2A1E18;--term:#0A0F11;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1311;--surface:#161C19;--surface-2:#1C2320;--ink:#E7ECE8;--ink-2:#C2CCC6;--muted:#94A29A;
    --line:#27302B;--line-strong:#36423B;--accent:#57C294;--accent-soft:#14261E;
    --clay:#E08F6E;--clay-soft:#2A1E18;--term:#0A0F11;

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.68;margin:0;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding-inline:20px}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
  p{margin:0}
  a{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}

  header{border-bottom:1px solid var(--line);background:var(--surface)}
  .mast{padding-block:32px 22px;display:flex;flex-direction:column;gap:10px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:-.025em}
  .mast p{color:var(--ink-2);font-size:14.5px;font-weight:300;max-width:60ch}

  .prog{height:3px;background:var(--surface-2)}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}

  main{padding-block:30px 60px}
  .meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .meta .qn{font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;color:var(--accent)}
  .meta .sc{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px 24px}
  .qtext{font-size:18px;font-weight:600;line-height:1.55;text-wrap:balance}
  pre{background:var(--term);color:#DCE6E3;border-radius:4px;padding:14px 16px;margin:16px 0 0;
      font-family:var(--mono);font-size:13px;line-height:1.7;overflow-x:auto}
  pre .p{color:#7FD1A8}
  pre .c{color:#7C9A93}
  code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:3px}

  .opts{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .opt{text-align:left;font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);
       background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;
       padding:13px 16px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;width:100%}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
  .opt:disabled{cursor:default}
  .opt .mk{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;flex:0 0 auto}
  .opt.right{border-color:var(--accent);background:var(--accent-soft)}
  .opt.right .mk{color:var(--accent)}
  .opt.wrong{border-color:var(--clay);background:var(--clay-soft)}
  .opt.wrong .mk{color:var(--clay)}
  .opt code{background:rgba(0,0,0,.06)}

  .typed{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
  input[type=text]{flex:1 1 240px;font-family:var(--mono);font-size:15px;color:var(--ink);
      background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:12px 14px}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  input[type=text]:disabled{opacity:.75}

  button.go{font-family:var(--sans);font-size:15px;font-weight:600;color:#fff;background:var(--accent);
      border:1px solid var(--accent);border-radius:5px;padding:12px 22px;cursor:pointer}
  button.go:hover{filter:brightness(1.08)}
  button.ghost{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-2);
      background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:11px 18px;cursor:pointer}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

  .fb{margin-top:18px;border-left:3px solid var(--accent);background:var(--accent-soft);
      border-radius:0 4px 4px 0;padding:14px 16px}
  .fb.no{border-left-color:var(--clay);background:var(--clay-soft)}
  .fb .v{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
         color:var(--accent);display:block;margin-bottom:5px}
  .fb.no .v{color:var(--clay)}
  .fb p{font-size:14px;color:var(--ink-2);line-height:1.65}
  .fb code{background:rgba(0,0,0,.06)}

  /* result */
  .res{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:32px 24px;text-align:center}
  .res .big{font-family:var(--mono);font-size:56px;font-weight:600;line-height:1;color:var(--accent);
            font-variant-numeric:tabular-nums}
  .res .big.mid{color:#B08322}
  .res .big.low{color:var(--clay)}
  .res h2{font-size:20px;margin-top:14px}
  .res p{color:var(--muted);font-size:14.5px;margin-top:8px;max-width:48ch;margin-inline:auto}
  .res .actions{justify-content:center}
  .missed{margin-top:26px;text-align:left;border-top:1px solid var(--line);padding-top:20px}
  .missed h3{font-size:14px;color:var(--muted);font-family:var(--mono);letter-spacing:.11em;

  .missed li{font-size:14px;color:var(--ink-2);line-height:1.6;margin-top:9px}
  .missed li b{color:var(--ink)}

  footer{border-top:1px solid var(--line);background:var(--surface);padding-block:22px}
  footer p{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  @media (max-width:560px){ .qcard{padding:20px 16px} .qtext{font-size:16.5px} }

</style>

<script>
(function(){
  const Q = window.QUIZ || [];

  const $ = id => document.getElementById(id);
  let i = 0, score = 0, missed = [], answered = false;

  const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ');

  function render(){
    answered = false;
    const q = Q[i];
    $('qn').textContent = 'Q ' + String(i+1).padStart(2,'0') + ' / ' + Q.length;
    $('sc').textContent = '정답 ' + score;
    $('prog').style.width = (i / Q.length * 100) + '%';

    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = '<div class="qtext">' + q.q + '</div>' + (q.pre ? '<pre>' + q.pre + '</pre>' : '');

    if (q.t){
      const wrap = document.createElement('div');
      wrap.className = 'typed';
      wrap.innerHTML = '<input type="text" id="inp" autocomplete="off" autocapitalize="off" ' +
                       'spellcheck="false" placeholder="명령을 그대로 입력하세요">' +
                       '<button class="go" id="chk">확인</button>';
      card.appendChild(wrap);
      card.appendChild(mkFoot());
      $('area').replaceChildren(card);
      $('inp').focus();
      $('chk').onclick = () => judgeTyped(q);
      $('inp').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); answered ? nextQ() : judgeTyped(q); } });
    } else {
      const order = q.o.map((t,n) => n);
      for (let k = order.length - 1; k > 0; k--){ const j = Math.floor(Math.random()*(k+1)); [order[k],order[j]] = [order[j],order[k]]; }
      const box = document.createElement('div');
      box.className = 'opts';
      order.forEach((oi, pos) => {
        const b = document.createElement('button');
        b.className = 'opt'; b.type = 'button'; b.dataset.i = oi;
        b.innerHTML = '<span class="mk">' + 'ABCD'[pos] + '</span><span>' + q.o[oi] + '</span>';
        b.onclick = () => judgeChoice(q, b, box);
        box.appendChild(b);
      });
      card.appendChild(box);
      card.appendChild(mkFoot());
      $('area').replaceChildren(card);
    }
  }

  function mkFoot(){
    const d = document.createElement('div');
    d.id = 'foot';
    return d;
  }

  function feedback(ok, q, extra){
    answered = true;
    score += ok ? 1 : 0;
    if (!ok) missed.push(i);
    $('sc').textContent = '정답 ' + score;
    const f = document.createElement('div');
    f.className = 'fb' + (ok ? '' : ' no');
    f.innerHTML = '<span class="v">' + (ok ? '정답' : '오답') + '</span><p>' + (extra || '') + q.e + '</p>';
    const act = document.createElement('div');
    act.className = 'actions';
    const b = document.createElement('button');
    b.className = 'go';
    b.textContent = (i === Q.length - 1) ? '결과 보기' : '다음 문제';
    b.onclick = nextQ;
    act.appendChild(b);
    const foot = $('foot');
    foot.replaceChildren(f, act);
    b.focus();
  }

  function judgeChoice(q, btn, box){
    if (answered) return;
    const pick = +btn.dataset.i, ok = pick === q.a;
    Array.from(box.children).forEach(el => {
      el.disabled = true;
      const n = +el.dataset.i;
      if (n === q.a) el.classList.add('right');
      else if (n === pick) el.classList.add('wrong');
    });
    feedback(ok, q, ok ? '' : '정답은 <code>' + q.o[q.a] + '</code> 입니다. ');
  }

  function judgeTyped(q){
    if (answered) return;
    const inp = $('inp');
    const v = norm(inp.value);
    if (!v){ inp.focus(); return; }
    const ok = q.acc.some(a => norm(a) === v);
    inp.disabled = true;
    $('chk').disabled = true;
    feedback(ok, q, ok ? '' : '정답은 <code>' + q.ans + '</code> 입니다. ');
  }

  function nextQ(){
    i++;
    if (i >= Q.length) result(); else render();
  }

  function result(){
    $('prog').style.width = '100%';
    $('qn').textContent = '완료';
    $('sc').textContent = '정답 ' + score;
    const pass = window.PASS || Math.ceil(Q.length*0.8);
    const cls = score >= pass ? "" : (score >= pass - 3 ? " mid" : " low");
    const msg = score >= pass
      ? '통과입니다. 오늘 분량을 충분히 소화했습니다.'
      : (score >= pass - 3
        ? '조금 아쉽습니다. 틀린 항목의 미션으로 돌아가 한 번만 더 확인하고 다시 풀어 보세요.'
        : '아직 손에 붙지 않았습니다. 실습 가이드의 미션 1번부터 다시 따라 해 보는 편이 빠릅니다.');

    const d = document.createElement('div');
    d.className = 'res';
    d.innerHTML =
      '<div class="big' + cls + '">' + score + ' / ' + Q.length + '</div>' +
      '<h2>' + (score >= pass ? "통과" : "한 번 더") + '</h2>' +
      '<p>' + msg + '</p>';

    if (missed.length){
      const m = document.createElement('div');
      m.className = 'missed';
      m.innerHTML = '<h3>다시 볼 문항</h3><ul>' +
        missed.map(n => '<li><b>Q' + String(n+1).padStart(2,'0') + '</b> — ' +
          Q[n].q.replace(/<[^>]+>/g,'') + '</li>').join('') + '</ul>';
      d.appendChild(m);
    }

    const act = document.createElement('div');
    act.className = 'actions';
    const again = document.createElement('button');
    again.className = 'go'; again.textContent = '처음부터 다시 풀기';
    again.onclick = () => { i = 0; score = 0; missed = []; render(); window.scrollTo(0,0); };
    act.appendChild(again);
    const back = document.createElement('a');
    back.href = 'lab.html'; back.className = 'ghost';
    back.style.cssText = 'text-decoration:none;display:inline-flex;align-items:center;padding:12px 20px;border:1px solid var(--line-strong);border-radius:5px;color:var(--ink-2);font-weight:600;font-size:15px';
    back.textContent = '실습 가이드로';
    act.appendChild(back);
    d.appendChild(act);

    $('area').replaceChildren(d);
  }

  render();
})();

</script>
<script src="../nav.js"></script>
</html>
